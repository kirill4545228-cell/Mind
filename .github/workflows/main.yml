name: Build plugin
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unzip (if a .zip is in the repo) and find project
        id: prep
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n1 || true)
          if [ -n "$ZIP" ]; then
            mkdir -p _src
            unzip -q -o "$ZIP" -d _src
            POM=$(find _src -name pom.xml | head -n1)
          else
            POM=$(find . -name pom.xml | head -n1)
          fi
          echo "Found: $POM"
          echo "pom=$POM" >> "$GITHUB_OUTPUT"

      - name: Build
        run: mvn -B -f "${{ steps.prep.outputs.pom }}" package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: MindFlayerFX
          path: '**/target/MindFlayerFX-*.jar'
